services:
  backend:
    build:
      context: ./backend
    # Awalan nama container diatur di deploy.<env>.env (CONTAINER_PREFIX). Default tetap "pasti"; dev dan prod
    # di server yang sama wajib berbeda (mis. pasti dan pasti-prod).
    container_name: ${CONTAINER_PREFIX:-pasti}-backend
    # Di server, deploy.sh mengisi BACKEND_ENV_FILE di deploy.<env>.env dengan profil environment terpilih (./backend/.env.dev atau ./backend/.env.prod).
    env_file:
      - ${BACKEND_ENV_FILE:-./backend/.env}
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${BACKEND_PORT:-8686}:8686"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - pasti-network
    restart: unless-stopped
    # Log container dibatasi ukurannya (5 berkas x 10 MB) supaya disk tidak penuh oleh log, berapa pun lamanya server berjalan.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    # Penanda sehat/tidak sehat di docker ps (/health murah dan tidak menyentuh database; /health/ready memeriksa database).
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8686/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

  frontend:
    build:
      context: ./frontend
      args:
        # Ditanam ke bundle frontend saat build. Di server, isi lewat deploy.<env>.env
        # (alamat backend yang dibuka browser pengguna); default untuk pengembangan lokal.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8686/api/v1}
        NEXT_PUBLIC_API_ROOT_URL: ${NEXT_PUBLIC_API_ROOT_URL:-http://localhost:8686}
        # Opsional: server ubin peta (kosong = OpenStreetMap). Isi di deploy.<env>.env bila jaringan memblokir OpenStreetMap.
        NEXT_PUBLIC_MAP_TILE_URL: ${NEXT_PUBLIC_MAP_TILE_URL:-}
        NEXT_PUBLIC_MAP_TILE_ATTRIBUTION: ${NEXT_PUBLIC_MAP_TILE_ATTRIBUTION:-}
        # Alamat halaman login yang tidak bisa ditebak. Kosong = pakai bawaan repo (frontend/login-path.txt); deploy.sh mengisinya
        # dengan alamat yang berlaku (bawaan repo atau LOGIN_PATH di deploy.<env>.env) agar sama dengan yang dipakai cek kesehatan.
        LOGIN_PATH: ${LOGIN_PATH:-}
        # Jalan pintas callback SSO (mati bawaan): 1 = frontend meneruskan /sso/callback/login ke backend bila proxy di depan domain salah mengarahkannya ke frontend.
        # Atur di deploy.<env>.env; lihat docs/deploy-vps.md. Alamat backend dari dalam jaringan Docker (nama layanan "backend", port di dalam container).
        SSO_CALLBACK_VIA_FRONTEND: ${SSO_CALLBACK_VIA_FRONTEND:-0}
        # Jalan pintas lebih luas (mati bawaan): 1 = frontend meneruskan SEMUA rute backend (/api/, /health, /sso/login, /sso/callback/login), untuk proxy atau
        # pemetaan alamat yang mengirim seluruh domain ke port frontend. Atur di deploy.<env>.env; lihat docs/deploy-vps.md.
        BACKEND_VIA_FRONTEND: ${BACKEND_VIA_FRONTEND:-0}
        BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://backend:8686}
    container_name: ${CONTAINER_PREFIX:-pasti}-frontend
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${FRONTEND_PORT:-3000}:3000"
    networks:
      - pasti-network
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    depends_on:
      - backend

networks:
  pasti-network:
    driver: bridge