services:
  backend:
    build:
      context: ./backend
    # Awalan nama container diatur di deploy.env (CONTAINER_PREFIX). Default tetap "pasti"; dev dan prod
    # di server yang sama wajib berbeda (mis. pasti dan pasti-prod).
    container_name: ${CONTAINER_PREFIX:-pasti}-backend
    env_file:
      - ./backend/.env
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${BACKEND_PORT:-8686}:8686"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - pasti-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Ditanam ke bundle frontend saat build. Di server, isi lewat deploy.env
        # (alamat backend yang dibuka browser pengguna); default untuk pengembangan lokal.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8686/api/v1}
        NEXT_PUBLIC_API_ROOT_URL: ${NEXT_PUBLIC_API_ROOT_URL:-http://localhost:8686}
        # Opsional: server ubin peta (kosong = OpenStreetMap). Isi di deploy.env bila jaringan memblokir OpenStreetMap.
        NEXT_PUBLIC_MAP_TILE_URL: ${NEXT_PUBLIC_MAP_TILE_URL:-}
        NEXT_PUBLIC_MAP_TILE_ATTRIBUTION: ${NEXT_PUBLIC_MAP_TILE_ATTRIBUTION:-}
        # Alamat halaman login yang tidak bisa ditebak (mis. /<heksadesimal acak>); deploy.sh membuatnya di deploy.env.
        # Build image menolak nilai kosong (Dockerfile: LOGIN_PATH_WAJIB=1) supaya /login tidak terbuka tanpa disengaja.
        LOGIN_PATH: ${LOGIN_PATH:-}
    container_name: ${CONTAINER_PREFIX:-pasti}-frontend
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${FRONTEND_PORT:-3000}:3000"
    networks:
      - pasti-network
    restart: unless-stopped
    depends_on:
      - backend

networks:
  pasti-network:
    driver: bridge