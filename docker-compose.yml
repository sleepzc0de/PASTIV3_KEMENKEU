services:
  backend:
    build:
      context: ./backend
    container_name: pasti-backend
    env_file:
      - ./backend/.env
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${BACKEND_PORT:-8686}:8686"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - pasti-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Ditanam ke bundle frontend saat build. Di server, isi lewat deploy.env
        # (alamat backend yang dibuka browser pengguna); default untuk pengembangan lokal.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8686/api/v1}
        NEXT_PUBLIC_API_ROOT_URL: ${NEXT_PUBLIC_API_ROOT_URL:-http://localhost:8686}
    container_name: pasti-frontend
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${FRONTEND_PORT:-3000}:3000"
    networks:
      - pasti-network
    restart: unless-stopped
    depends_on:
      - backend

networks:
  pasti-network:
    driver: bridge