# Contoh konfigurasi Nginx untuk PRODUCTION: https://pasti.kemenkeu.go.id
#
# Cara pakai (di server production):
#   1. Salin ke /etc/nginx/sites-available/pasti dan sesuaikan bagian bertanda [SESUAIKAN].
#   2. sudo ln -s /etc/nginx/sites-available/pasti /etc/nginx/sites-enabled/pasti
#   3. sudo nginx -t && sudo systemctl reload nginx
#
# Prasyarat: ./deploy.sh prod dengan BIND_ADDRESS=127.0.0.1 di deploy.env, sehingga backend dan
# frontend hanya bisa dijangkau lewat Nginx ini (port aplikasi tidak terbuka ke jaringan).
#
# Bila HTTPS sudah diterminasi oleh perangkat lain (load balancer / WAF Kemenkeu), perangkat itu
# harus meneruskan rute yang sama dengan blok "location" di bawah:
#     /api/...            -> backend   (127.0.0.1:BACKEND_PORT)
#     /health             -> backend
#     /sso/login          -> backend
#     /sso/callback/login -> backend
#     semua lainnya       -> frontend  (127.0.0.1:FRONTEND_PORT)
# Perhatikan: /sso/callback (tanpa /login) adalah halaman FRONTEND, bukan backend.

upstream pasti_backend  { server 127.0.0.1:8686; keepalive 16; }   # [SESUAIKAN] BACKEND_PORT di deploy.env
upstream pasti_frontend { server 127.0.0.1:3000; keepalive 16; }   # [SESUAIKAN] FRONTEND_PORT di deploy.env

# HTTP -> HTTPS
server {
    listen 80;
    server_name pasti.kemenkeu.go.id;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name pasti.kemenkeu.go.id;

    # [SESUAIKAN] Sertifikat dari tim infrastruktur / CA Kemenkeu.
    ssl_certificate     /etc/ssl/pasti/fullchain.pem;
    ssl_certificate_key /etc/ssl/pasti/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 10m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Aktifkan HSTS hanya setelah HTTPS dipastikan stabil (efeknya bertahan di browser pengguna):
    # add_header Strict-Transport-Security "max-age=31536000" always;

    # Pendaftaran akun publik ditutup. Rute ini hanya dimaksudkan untuk setup awal/pengujian dan
    # tanpa ini siapa pun yang bisa menjangkau server dapat membuat akun lalu login.
    location = /api/v1/auth/register { return 404; }

    # Rute milik BACKEND.
    location ~ ^/(api/|health$|sso/login$|sso/callback/login$) {
        proxy_pass http://pasti_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 900s;   # sinkronisasi Inaproc berjalan sinkron dan bisa lama
    }

    # Semua lainnya: FRONTEND (Next.js).
    location / {
        proxy_pass http://pasti_frontend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
